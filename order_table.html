<div class="table-wrap">
  <table>
    <thead><tr><th>Order</th><th>Patient</th><th>Created</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for order in orders %}
      <tr>
        <td><a class="table-link" href="{% url 'order_detail' order.pk %}">{{ order.order_number }}</a></td>
        <td><strong>{{ order.patient.full_name }}</strong><span class="subline">{{ order.patient.patient_code }}</span></td>
        <td>{{ order.created_at|date:"d M Y, H:i" }}</td>
        <td><span class="status status-{{ order.status }}">{{ order.get_status_display }}</span></td>
        <td><a class="text-link" href="{% url 'order_detail' order.pk %}">View →</a></td>
      </tr>
      {% empty %}
      <tr><td class="table-empty" colspan="5">No orders yet. Create a test order to get started.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
