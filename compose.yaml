services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: diagnostic_center
      POSTGRES_USER: diagnostic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnostic -d diagnostic_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://diagnostic:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/diagnostic_center
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
